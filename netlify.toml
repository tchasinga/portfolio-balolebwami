[build]
  command = "npm run build"
  # Next.js output directory. Netlify's Next.js runtime needs this to deploy the
  # app (pages, server functions, static assets) instead of the repository root.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Explicitly enable Netlify's Next.js runtime so pages and server functions
# are generated from the .next output instead of uploading it as static files.
[[plugins]]
  package = "@netlify/plugin-nextjs"
